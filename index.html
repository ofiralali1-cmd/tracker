<!doctype html><html lang="en" dir="ltr"><head><meta charset="utf-8"><title>Daily Tracker</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#000000"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<style>
:root{--bg:#000;--card:#111;--tx:#f2f2f2;--mu:#8a8a8a;--ac:#6366f1;--bd:#262626;--g:#4ade80;--y:#facc15;--r:#f87171;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:84px}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 12px}h2{font-size:15px;color:var(--mu);margin:20px 0 8px;text-transform:uppercase;letter-spacing:.04em}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:10px}
.row{display:flex;align-items:center;gap:8px}.sp{flex:1}.mu{color:var(--mu);font-size:13px}
select,input{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:10px;min-width:0;width:100%}
select{width:auto;flex:1}input[type=checkbox]{width:26px;height:26px;flex:none}
button{font:inherit;border:0;border-radius:10px;padding:10px 14px;background:var(--ac);color:#fff;min-height:44px}
button.s{background:var(--bg);color:var(--tx);border:1px solid var(--bd);padding:8px 12px;min-height:40px}
button.x{background:none;color:var(--r);padding:8px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}details summary{padding:6px 0}
.tot{text-align:center;padding:10px 4px}.tot b{display:block;font-size:20px}
.pb{position:relative;height:12px;background:var(--bd);border-radius:6px;overflow:hidden;margin:6px 0 2px}.pb i{display:block;height:100%;border-radius:6px}.pb u{position:absolute;top:0;bottom:0;left:76.9%;width:2px;background:#fff8}
.bar{height:6px;background:var(--bd);border-radius:3px;margin-top:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;color:var(--mu);border-radius:0;font-size:11px;padding:6px 2px;min-height:58px}nav button.on{color:var(--ac);font-weight:700}
nav span{display:block;font-size:22px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.cal div{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:8px;background:var(--card);border:1px solid var(--bd);font-size:14px}
.cal .h{background:none;border:0;color:var(--mu);font-size:12px;aspect-ratio:auto}
.mini{font-size:9px;border-radius:3px;border-width:0}
.cal .today{outline:2px solid var(--ac)}.cal .sel{box-shadow:0 0 0 3px var(--ac)}
.g{background:var(--g)!important;color:#000}.y{background:var(--y)!important;color:#000}.r{background:var(--r)!important;color:#000}
.yr{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.yr .card{padding:6px}
.yr .cal{gap:1px}.yr .cal div{border-radius:2px;font-size:0}
.done{text-decoration:line-through;color:var(--mu)}
</style></head><body><main id="app"></main>
<nav id="nav"></nav>
<script>
const K='dt1',$=s=>document.querySelector(s),uid=()=>Math.random().toString(36).slice(2,9);
const pad=n=>String(n).padStart(2,'0'),key=(y,m,d)=>y+'-'+pad(m+1)+'-'+pad(d);
const today=()=>{const d=new Date();return key(d.getFullYear(),d.getMonth(),d.getDate())};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num=v=>parseFloat(v)||0,r1=n=>Math.round(n*10)/10;
let S={};try{S=JSON.parse(localStorage.getItem(K))||{}}catch(e){}
S=Object.assign({foods:[],mult:{},target:{},rec:[],done:{},one:[],log:[],runs:[],wk:[],wdone:{},marks:{},weights:[],goal:null,day:today()},S);
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
S.wk.forEach(x=>{if(!x.a){x.a={r:x.r||0,kg:x.kg||0};x.b={r:x.r||0,kg:x.kg||0}}x.h=(x.h||[]).map(k=>k.a?k:{d:k.d,a:[k.r||0,k.kg||0],b:[k.r||0,k.kg||0]})});
function roll(){if(S.day!==today()){S.day=today();S.mult={};S.log=[];S.done={};S.wdone={};S.one=S.one.filter(t=>!t.d);save();return true}}
let page=0,editF=null,view='month',now=new Date(),cy=now.getFullYear(),cm=now.getMonth(),sel=today();
const tabs=[['🍎','Nutrition'],['✅','Tasks'],['📅','Tracker'],['⚖️','Weight'],['🏃','Running'],['🏋️','Workout']];
const MN=['January','February','March','April','May','June','July','August','September','October','November','December'];

function nutrition(){
 const T={cal:0,p:0,c:0,f:0};S.log.forEach(l=>{const f=S.foods.find(x=>x.id===l.fid);if(f){T.cal+=f.cal*l.g/100;T.p+=f.p*l.g/100;T.c+=f.c*l.g/100;T.f+=f.f*l.g/100}});
 const tg=S.target,L=[['cal','Calories','kcal'],['p','Protein','g'],['c','Carbs','g'],['f','Fat','g']];
 const e=S.foods.find(x=>x.id===editF)||{};
 const bars=L.map(([k,n,u])=>{const t=tg[k],pct=t?T[k]/t*100:0,dev=Math.abs(pct-100),col=!t?'var(--mu)':dev<=10?'var(--g)':dev<30?'var(--y)':'var(--r)';
  return `<div class="card"><div class="row"><b class="sp">${n}</b><span>${r1(T[k])} / ${t||'?'} ${u}</span></div><div class="pb"><i style="width:${Math.min(pct,130)/130*100}%;background:${col}"></i><u></u></div><div class="mu">${t?Math.round(pct)+'% of target':'Set a target below'}</div></div>`}).join('');
 return `<h1>Nutrition</h1>${bars}
 <h2>Log what I ate</h2>
 <div class="card">${S.foods.length?`<div class="row"><select id="lf">${S.foods.map(f=>`<option value="${f.id}" ${f.id===lastF?'selected':''}>${esc(f.name)}</option>`).join('')}</select><input id="lg" type="number" inputmode="decimal" placeholder="grams" style="width:100px"><button onclick="addL()">Add</button></div>`:'<span class="mu">Add foods to your library below first.</span>'}</div>
 ${S.log.map(l=>{const f=S.foods.find(x=>x.id===l.fid);return f?`<div class="card row"><div class="sp"><b>${esc(f.name)}</b><div class="mu">${r1(f.cal*l.g/100)} kcal · P${r1(f.p*l.g/100)} · C${r1(f.c*l.g/100)} · F${r1(f.f*l.g/100)}</div></div><input type="number" inputmode="decimal" style="width:80px" value="${l.g}" onchange="S.log.find(x=>x.id==='${l.id}').g=num(this.value);save();draw()"><span class="mu">g</span><button class="x" onclick="S.log=S.log.filter(x=>x.id!=='${l.id}');save();draw()">✕</button></div>`:''}).join('')}
 <h2>Daily targets</h2><div class="card grid2">${L.map(([k,n])=>`<input type="number" inputmode="decimal" placeholder="${n}" value="${tg[k]||''}" onchange="S.target['${k}']=num(this.value);save();draw()">`).join('')}</div>
 <h2>My food library <span class="mu">(values per 100g)</span></h2>
 ${S.foods.map(f=>`<div class="card row"><div class="sp"><b>${esc(f.name)}</b><div class="mu">${f.cal} kcal · P${f.p} · C${f.c} · F${f.f}</div></div><button class="s" onclick="editF='${f.id}';draw()">Edit</button><button class="${delAsk===f.id?'':'x'}" style="${delAsk===f.id?'background:var(--r);color:#000':''}" onclick="delF('${f.id}')">${delAsk===f.id?'Sure?':'✕'}</button></div>`).join('')}
 <div class="card"><b>${e.id?'Edit food':'Add new food'}</b><input id="fn" placeholder="Food name" style="margin-top:8px" value="${esc(e.name||'')}"><div class="grid2" style="margin-top:8px">
 <input id="fc" type="number" inputmode="decimal" placeholder="Calories" value="${e.cal??''}"><input id="fp" type="number" inputmode="decimal" placeholder="Protein g" value="${e.p??''}">
 <input id="fcb" type="number" inputmode="decimal" placeholder="Carbs g" value="${e.c??''}"><input id="ff" type="number" inputmode="decimal" placeholder="Fat g" value="${e.f??''}"></div>
 <div class="row" style="margin-top:8px"><button onclick="saveF()">${e.id?'Save':'Add'}</button>${e.id?'<button class="s" onclick="editF=null;draw()">Cancel</button>':''}</div></div>`}
let lastF='';
function addL(){const fid=$('#lf').value,g=num($('#lg').value);if(!fid||!g)return;S.log.push({id:uid(),fid,g});lastF=fid;save();draw()}
let delAsk=null;
function delF(id){if(delAsk!==id){delAsk=id;draw();setTimeout(()=>{if(delAsk===id){delAsk=null;draw()}},4000);return}S.foods=S.foods.filter(f=>f.id!==id);S.log=S.log.filter(l=>l.fid!==id);delAsk=null;save();draw()}
function saveF(){const name=$('#fn').value.trim();if(!name)return;const o={name,cal:num($('#fc').value),p:num($('#fp').value),c:num($('#fcb').value),f:num($('#ff').value)};
 if(editF)Object.assign(S.foods.find(f=>f.id===editF),o);else S.foods.push({id:uid(),...o});editF=null;save();draw()}

function tasks(){
 return `<h1>Tasks</h1><h2>Daily recurring</h2>
 ${S.rec.map(t=>`<div class="card row"><input type="checkbox" ${S.done[t.id]?'checked':''} onchange="S.done['${t.id}']=this.checked;save();draw()"><span class="sp ${S.done[t.id]?'done':''}">${esc(t.t)}</span><button class="x" onclick="S.rec=S.rec.filter(x=>x.id!=='${t.id}');save();draw()">✕</button></div>`).join('')||'<p class="mu">Nothing yet.</p>'}
 <div class="row"><input id="nr" placeholder="New recurring task"><button onclick="addT('rec','nr')">Add</button></div>
 <h2>Today only <span class="mu">(cleared tomorrow)</span></h2>
 ${S.one.map(t=>`<div class="card row"><input type="checkbox" ${t.d?'checked':''} onchange="S.one.find(x=>x.id==='${t.id}').d=this.checked;save();draw()"><span class="sp ${t.d?'done':''}">${esc(t.t)}</span><button class="x" onclick="S.one=S.one.filter(x=>x.id!=='${t.id}');save();draw()">✕</button></div>`).join('')||'<p class="mu">Nothing yet.</p>'}
 <div class="row"><input id="no" placeholder="New one-day task"><button onclick="addT('one','no')">Add</button></div>`}
function addT(l,id){const t=$('#'+id).value.trim();if(!t)return;S[l].push({id:uid(),t,d:false});save();draw()}

function mini(y,m,big){
 const first=new Date(y,m,1).getDay(),n=new Date(y,m+1,0).getDate();let h='';
 if(big)h+=['S','M','T','W','T','F','S'].map(d=>`<div class="h">${d}</div>`).join('');
 for(let i=0;i<first;i++)h+=big?'<div style="visibility:hidden"></div>':'<div style="visibility:hidden"></div>';
 for(let d=1;d<=n;d++){const k=key(y,m,d);h+=`<div class="${S.marks[k]||''} ${k===today()?'today':''} ${big&&k===sel?'sel':''}" ${big?`onclick="sel='${k}';draw()"`:''}>${big?d:''}</div>`}
 return `<div class="cal ${big?'':'mini'}">${h}</div>`}
function tracker(){
 const nav=`<div class="row"><button class="s" onclick="mv(-1)">‹</button><b class="sp" style="text-align:center">${view==='month'?MN[cm]+' ':''}${cy}</b><button class="s" onclick="mv(1)">›</button><button class="s" onclick="view=view==='month'?'year':'month';draw()">${view==='month'?'🔍 Year':'🔍 Month'}</button></div>`;
 let body;
 if(view==='year')body=`<div class="yr" style="margin-top:12px">${MN.map((n,i)=>`<div class="card" onclick="cm=${i};view='month';draw()"><div class="mu" style="text-align:center;margin-bottom:4px">${n.slice(0,3)}</div>${mini(cy,i,false)}</div>`).join('')}</div>`;
 else body=`<div style="margin-top:12px">${mini(cy,cm,true)}</div><div class="card" style="margin-top:12px"><div class="mu">${sel}</div><div class="grid4" style="margin-top:8px">${[['g','Good'],['y','Okay'],['r','Bad'],['','Clear']].map(([c,n])=>`<button class="s ${c}" onclick="mark('${c}')">${n}</button>`).join('')}</div></div>`;
 return `<h1>Day tracker</h1>${nav}${body}`}
function mv(d){if(view==='year')cy+=d;else{cm+=d;if(cm<0){cm=11;cy--}if(cm>11){cm=0;cy++}}draw()}
function mark(c){if(c)S.marks[sel]=c;else delete S.marks[sel];save();draw()}

function weight(){
 const w=[...S.weights].sort((a,b)=>a.d<b.d?-1:1);
 let chart='';
 if(w.length>1){const v=w.map(x=>x.w).concat(S.goal?[S.goal]:[]),mn=Math.min(...v)-1,mx=Math.max(...v)+1,X=i=>20+i*(270/(w.length-1)),Y=x=>120-(x-mn)/(mx-mn)*100;
  chart=`<div class="card"><svg viewBox="0 0 300 140" width="100%"><polyline fill="none" stroke="var(--ac)" stroke-width="2.5" points="${w.map((x,i)=>X(i)+','+Y(x.w)).join(' ')}"/>${w.map((x,i)=>`<circle cx="${X(i)}" cy="${Y(x.w)}" r="3.5" fill="var(--ac)"/>`).join('')}${S.goal?`<line x1="20" x2="290" y1="${Y(S.goal)}" y2="${Y(S.goal)}" stroke="var(--g)" stroke-dasharray="4"/><text x="22" y="${Y(S.goal)-4}" font-size="9" fill="var(--mu)">goal ${S.goal}</text>`:''}<text x="2" y="24" font-size="9" fill="var(--mu)">${r1(mx)}</text><text x="2" y="124" font-size="9" fill="var(--mu)">${r1(mn)}</text></svg></div>`}
 const rows=[...w].reverse().map(x=>{const i=w.indexOf(x),pv=i>0?r1(x.w-w[i-1].w):null,f=i>0?r1(x.w-w[0].w):null;
  return `<div class="card row"><div class="sp"><b>${x.w}</b> <span class="mu">${x.d}</span>${pv!==null?`<div class="mu">vs previous ${pv>0?'+':''}${pv} · vs first ${f>0?'+':''}${f}</div>`:''}</div><button class="s" onclick="editW('${x.id}')">Edit</button><button class="x" onclick="S.weights=S.weights.filter(a=>a.id!=='${x.id}');save();draw()">✕</button></div>`}).join('');
 return `<h1>Weight</h1><div class="card"><div class="grid2"><input id="wd" type="date" value="${today()}"><input id="wv" type="number" inputmode="decimal" step="0.1" placeholder="Weight"></div><div class="row" style="margin-top:8px"><button onclick="addW()">Add / update entry</button></div></div>
 <div class="card row"><span class="mu">Goal weight</span><input type="number" inputmode="decimal" step="0.1" style="width:110px" value="${S.goal||''}" onchange="S.goal=num(this.value)||null;save();draw()"></div>
 ${chart}${rows||'<p class="mu">No entries yet.</p>'}
 <h2>Backup</h2><div class="row"><button class="s" onclick="exp()">Export JSON</button><label class="s" style="border:1px solid var(--bd);border-radius:10px;padding:10px 12px">Import<input type="file" accept=".json" hidden onchange="imp(this.files[0])"></label></div>`}
function addW(){const w=num($('#wv').value),d=$('#wd').value;if(!w||!d)return;const o=S.weights.find(x=>x.d===d);if(o)o.w=w;else S.weights.push({id:uid(),d,w});save();draw()}
function editW(id){const x=S.weights.find(a=>a.id===id);$('#wd').value=x.d;$('#wv').value=x.w;$('#wv').focus();scrollTo(0,0)}
function exp(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='tracker-backup.json';a.click()}
function imp(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{S=Object.assign(S,JSON.parse(r.result));roll();save();draw();alert('Imported')}catch(e){alert('Invalid file')}};r.readAsText(f)}


const pT=v=>{const p=String(v).trim().split(':').map(Number);if(!String(v).trim()||p.some(isNaN))return 0;return p.length===1?p[0]*60:p.length===2?p[0]*60+p[1]:p[0]*3600+p[1]*60+p[2]};
const fT=x=>{x=Math.round(x);const h=Math.floor(x/3600),m=Math.floor(x%3600/60),c=x%60;return (h?h+':'+pad(m):m)+':'+pad(c)};
let editR=null,ask=null;
const dbtn=(id,l)=>`<button class="${ask===id?'':'x'}" style="${ask===id?'background:var(--r);color:#000':''}" onclick="del2('${id}','${l}')">${ask===id?'Sure?':'✕'}</button>`;
function del2(id,l){if(ask!==id){ask=id;draw();setTimeout(()=>{if(ask===id){ask=null;draw()}},4000);return}S[l]=S[l].filter(x=>x.id!==id);ask=null;save();draw()}
function running(){
 const R=[...S.runs].sort((a,b)=>a.d<b.d?1:a.d>b.d?-1:0),e=S.runs.find(x=>x.id===editR)||{};
 const tk=R.reduce((a,r)=>a+r.km,0),ts=R.reduce((a,r)=>a+r.sec,0),now=new Date(today());
 const wk=R.filter(r=>(now-new Date(r.d))/864e5<7).reduce((a,r)=>a+r.km,0);
 const ps=R.filter(r=>r.km>0&&r.sec>0).map(r=>r.sec/r.km),best=ps.length?Math.min(...ps):0;
 return `<h1>Running</h1>
 ${R.length?`<div class="grid2"><div class="card tot"><b>${r1(tk)} km</b><span class="mu">Total · ${R.length} runs</span></div><div class="card tot"><b>${r1(wk)} km</b><span class="mu">Last 7 days</span></div><div class="card tot"><b>${tk&&ts?fT(ts/tk):'-'}</b><span class="mu">Avg pace /km</span></div><div class="card tot"><b>${best?fT(best):'-'}</b><span class="mu">Best pace /km</span></div></div>`:''}
 <h2>${e.id?'Edit run':'Add run'}</h2><div class="card"><input id="rd" type="date" value="${e.d||today()}"><div class="grid2" style="margin-top:8px"><input id="rk" type="number" inputmode="decimal" step="0.01" placeholder="Distance (km)" value="${e.km??''}"><input id="rt" placeholder="Time (mm:ss)" value="${e.sec?fT(e.sec):''}"></div><div class="row" style="margin-top:8px"><button onclick="saveR()">${e.id?'Save':'Add run'}</button>${e.id?'<button class="s" onclick="editR=null;draw()">Cancel</button>':''}</div></div>
 <h2>History</h2>${R.map(r=>`<div class="card row"><div class="sp"><b>${r1(r.km)} km</b> <span class="mu">${r.d}</span><div class="mu">${fT(r.sec)}${r.km&&r.sec?' · '+fT(r.sec/r.km)+' /km · '+r1(r.km/r.sec*3600)+' km/h':''}</div></div><button class="s" onclick="editR='${r.id}';draw();scrollTo(0,0)">Edit</button>${dbtn(r.id,'runs')}</div>`).join('')||'<p class="mu">No runs yet.</p>'}`}
function saveR(){const km=num($('#rk').value),sec=pT($('#rt').value),d=$('#rd').value;if(!km||!sec||!d)return;const o={d,km,sec};if(editR)Object.assign(S.runs.find(x=>x.id===editR),o);else S.runs.push({id:uid(),...o});editR=null;save();draw()}
function workout(){
 const W=S.wk,dn=W.filter(x=>S.wdone[x.id]).length;
 const set=(x,k,n)=>`<div style="margin-top:10px"><b class="mu">Set ${n}</b><div class="grid2" style="margin-top:4px"><div><span class="mu">Reps</span><input type="number" inputmode="decimal" value="${x[k].r||''}" onchange="wSet('${x.id}','${k}','r',this.value)"></div><div><span class="mu">Weight (kg)</span><input type="number" inputmode="decimal" step="0.5" value="${x[k].kg||''}" onchange="wSet('${x.id}','${k}','kg',this.value)"></div></div></div>`;
 return `<h1>Workout</h1>${W.length?`<p class="mu">${dn}/${W.length} done today · checkboxes reset every day</p>`:''}
 ${W.map(x=>`<div class="card"><div class="row"><input type="checkbox" ${S.wdone[x.id]?'checked':''} onchange="S.wdone['${x.id}']=this.checked;save();draw()"><input value="${esc(x.n)}" onchange="wName('${x.id}',this.value)"></div>${set(x,'a',1)}${set(x,'b',2)}
 <details><summary class="mu">Progress history (${x.h.length})</summary><div class="mu">${x.h.slice(-8).reverse().map(k=>`${k.d}<br>&nbsp;Set 1: ${k.a[0]} × ${k.a[1]} kg<br>&nbsp;Set 2: ${k.b[0]} × ${k.b[1]} kg`).join('<br>')}</div></details>
 <button class="s" style="width:100%;margin-top:8px;${ask===x.id?'background:var(--r);color:#000':'color:var(--r)'}" onclick="del2('${x.id}','wk')">${ask===x.id?'Tap again to delete':'Delete exercise'}</button></div>`).join('')||'<p class="mu">No exercises yet. Add your first one below.</p>'}
 <h2>Add exercise</h2><div class="card"><input id="xn" placeholder="Exercise name"><div class="grid2" style="margin-top:8px"><input id="xr1" type="number" inputmode="decimal" placeholder="Set 1 reps"><input id="xk1" type="number" inputmode="decimal" step="0.5" placeholder="Set 1 kg"><input id="xr2" type="number" inputmode="decimal" placeholder="Set 2 reps"><input id="xk2" type="number" inputmode="decimal" step="0.5" placeholder="Set 2 kg"></div><p class="mu">Leave Set 2 empty to copy Set 1.</p><button onclick="saveX()">Add</button></div>`}
const snap=x=>({d:today(),a:[x.a.r,x.a.kg],b:[x.b.r,x.b.kg]});
function saveX(){const n=$('#xn').value.trim();if(!n)return;const a={r:num($('#xr1').value),kg:num($('#xk1').value)},e2=!$('#xr2').value&&!$('#xk2').value,b=e2?{...a}:{r:num($('#xr2').value),kg:num($('#xk2').value)};const x={id:uid(),n,a,b};x.h=[snap(x)];S.wk.push(x);save();draw()}
function wName(id,v){const x=S.wk.find(a=>a.id===id);if(x&&v.trim())x.n=v.trim();save();draw()}
function wSet(id,k,f,v){const x=S.wk.find(a=>a.id===id);if(!x)return;x[k][f]=num(v);const sn=snap(x),l=x.h[x.h.length-1];if(l&&l.d===sn.d)x.h[x.h.length-1]=sn;else x.h.push(sn);x.h=x.h.slice(-40);save();draw()}
function draw(){roll();const y=scrollY;$('#app').innerHTML=[nutrition,tasks,tracker,weight,running,workout][page]();
 $('#nav').innerHTML=tabs.map((t,i)=>`<button class="${i===page?'on':''}" onclick="page=${i};draw();scrollTo(0,0)"><span>${t[0]}</span>${t[1]}</button>`).join('');scrollTo(0,y)}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S.day!==today()){sel=today();draw()}});
draw();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
